[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vuatho-qa-daily-assistant"
version = "0.1.0"
description = "Read-only daily QA intelligence for VuaTho"
requires-python = ">=3.12"
dependencies = ["playwright>=1.49,<2", "telethon>=1.37,<2", "PyNaCl>=1.5,<2"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
vuatho-qa = "main:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
