name: Daily QA report
on:
  schedule:
    # 00:30 UTC = 07:30 Asia/Ho_Chi_Minh; GitHub schedules may be delayed.
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: daily-qa
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Materialize protected Product Hub browser state
        env:
          PRODUCT_HUB_STORAGE_STATE: ${{ secrets.PRODUCT_HUB_STORAGE_STATE }}
        run: |
          if [ -n "$PRODUCT_HUB_STORAGE_STATE" ]; then
            mkdir -p playwright/.auth
            printf '%s' "$PRODUCT_HUB_STORAGE_STATE" > playwright/.auth/state.json
            echo "PRODUCT_HUB_STORAGE_STATE=playwright/.auth/state.json" >> "$GITHUB_ENV"
          fi
      - name: Run QA collection and report (retry transient failure)
        env:
          PRODUCT_HUB_URL: ${{ vars.PRODUCT_HUB_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_TITLE: ${{ vars.TELEGRAM_CHAT_TITLE }}
        run: |
          for attempt in 1 2 3; do
            python -m main && break
            status=$?
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            sleep $((attempt * 20))
          done
      - name: Persist reports and history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports || true
          git diff --cached --quiet || git commit -m "chore: daily QA report $(date -u +%F)"
          git push
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-qa-run-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
