name: Build Windows setup wizard
on:
  push:
    paths:
      - 'setup/**'
      - '.github/workflows/setup-wizard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright telethon pynacl pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --collect-all playwright --collect-all telethon --collect-all nacl --name VuaThoQASetup setup/windows_wizard.py
      - uses: actions/upload-artifact@v4
        with:
          name: VuaThoQASetup-Windows
          path: dist/VuaThoQASetup.exe
