name: Build Windows setup wizard
on:
  push:
    paths:
      - 'setup/**'
      - 'windows_setup.py'
      - '.github/workflows/setup-wizard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright telethon pynacl pyinstaller
      - name: Build one-file Windows wizard
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --paths .
          --hidden-import setup.async_utils
          --hidden-import setup.github_config
          --hidden-import setup.product_hub_enrollment
          --hidden-import setup.windows_wizard
          --collect-all playwright
          --collect-all telethon
          --collect-all nacl
          --name VuaThoQASetup windows_setup.py
      - name: Smoke test packaged EXE module graph
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "VuaThoQASetup-self-test.txt"
          $env:VUA_THO_SETUP_SELF_TEST_REPORT = $report
          $process = Start-Process -FilePath "$PWD\dist\VuaThoQASetup.exe" -ArgumentList "--self-test" -Wait -PassThru
          Remove-Item Env:VUA_THO_SETUP_SELF_TEST_REPORT
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) {
            throw "Packaged wizard self-test failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path $report) -or (Get-Content $report -Raw) -notmatch '^SELF-TEST OK:') {
            throw "Packaged wizard self-test did not write a success report."
          }
          Write-Host "Packaged wizard self-test passed (exit code 0)."
      - uses: actions/upload-artifact@v4
        with:
          name: VuaThoQASetup-Windows
          path: dist/VuaThoQASetup.exe
